name: Deploy to Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 1. Go to project directory
            cd ${{ secrets.SERVER_APP_DIR || '/var/www/ugcexpert' }}

            # 2. Pull latest code from GitHub
            git fetch origin
            git reset --hard origin/main

            # 3. Install dependencies
            npm ci || npm install

            # 4. Generate Prisma Client & sync SQLite database
            npx prisma generate
            npx prisma db push

            # 5. Build full-stack application (frontend + server bundle)
            npm run build

            # 6. Restart server using PM2
            pm2 restart ugcexpert || pm2 start dist/server.cjs --name ugcexpert --env production
            pm2 save
